<rect x="0.5" y="0.5" width="999" height="751" rx="18" class="bgcard"/>
<text x="36.0" y="44.0" class="eyebrow">VISUAL ABSTRACT  ·  TARGET LEAKAGE  ·  CLINICAL MACHINE LEARNING  ·  SCIKIT-LEARN</text>
<text x="36.0" y="79.0" class="title">When 99% accuracy means nothing</text>
<text x="36.0" y="106.0" class="sub">Target leakage found and measured: removing the two diagnostic assays drops ROC AUC from 0.996 to 0.615</text>
<rect x="36" y="128" width="296" height="368" rx="12" class="panel"/><text x="52.0" y="154.0" class="eyebrow">QUESTION</text><text x="52.0" y="176.0" class="h2">Prediction, or reading the test?</text>
<path class="m-ecg" d="M52.0,240.0 L66.0,240.0 L70.0,234.0 L74.0,240.0 L82.0,240.0 L85.0,246.0 L89.0,206.0 L93.0,254.0 L97.0,240.0 L108.0,240.0 L114.0,231.0 L122.0,240.0 L136.0,240.0 L136.0,240.0 L150.0,240.0 L154.0,234.0 L158.0,240.0 L166.0,240.0 L169.0,246.0 L173.0,206.0 L177.0,254.0 L181.0,240.0 L192.0,240.0 L198.0,231.0 L206.0,240.0 L220.0,240.0 L220.0,240.0 L234.0,240.0 L238.0,234.0 L242.0,240.0 L250.0,240.0 L253.0,246.0 L257.0,206.0 L261.0,254.0 L265.0,240.0 L276.0,240.0 L282.0,231.0 L290.0,240.0 L304.0,240.0"/>
<path d="M138.0,318.0 A46,46 0 0 1 161.0,278.2" class="m-gauge acc"/>
<path d="M161.0,278.2 A46,46 0 0 1 207.0,278.2" class="m-gauge cb"/>
<path d="M207.0,278.2 A46,46 0 0 1 230.0,318.0" class="m-gauge hom"/>
<line x1="184.0" y1="318" x2="210.2" y2="296.3" class="m-needle"/>
<circle cx="184.0" cy="318" r="4" class="m-center"/>
<text x="132.0" y="320.0" class="m-lab" text-anchor="end">label</text>
<text x="236.0" y="320.0" class="m-lab">assay</text>
<text x="184.0" y="342.0" class="small" text-anchor="middle">The label and two features come from one measurement</text>
<text x="52.0" y="368.0" class="body">Troponin and CK-MB are not risk</text>
<text x="52.0" y="384.5" class="body">factors. They are the blood tests a</text>
<text x="52.0" y="401.0" class="body">heart attack is diagnosed with, so a</text>
<text x="52.0" y="417.5" class="body">model given them recovers the label</text>
<text x="52.0" y="434.0" class="body">from the measurement that made it.</text>
<rect x="48" y="446" width="272" height="38" rx="8" class="qbox"/>
<circle cx="68" cy="465" r="10" class="qmark"/>
<text x="68.0" y="470.0" class="qmark-t" text-anchor="middle">?</text>
<text x="86.0" y="461.0" class="q">How much of the accuracy survives</text>
<text x="86.0" y="477.0" class="q">removing the diagnostic assays?</text>
<rect x="352" y="128" width="296" height="368" rx="12" class="panel"/><text x="368.0" y="154.0" class="eyebrow">DATA AND DESIGN</text><text x="368.0" y="176.0" class="h2">1,319 patient records</text>
<rect x="368" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="222.0" class="num">1,283</text>
<text x="380.0" y="239.0" class="small">patients after QC</text>
<rect x="504" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="222.0" class="num">8</text>
<text x="516.0" y="239.0" class="small">clinical features</text>
<rect x="368" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="296.0" class="num">2</text>
<text x="380.0" y="313.0" class="small">engineered flags</text>
<rect x="504" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="296.0" class="num">75/25</text>
<text x="516.0" y="313.0" class="small">train / test split</text>
<text x="368.0" y="362.0" class="body">Physically impossible readings (heart</text>
<text x="368.0" y="378.5" class="body">rate above 200, blood sugar outside 50</text>
<text x="368.0" y="395.0" class="body">to 600 mg/dL, CK-MB above 200) are</text>
<text x="368.0" y="411.5" class="body">removed before modeling.</text>
<line x1="368" y1="446" x2="632" y2="446" class="rule"/>
<text x="368.0" y="466.0" class="small">Flag built at troponin &gt; 0.04, the clinical cut-off</text>
<text x="368.0" y="481.0" class="small">Scoring: 5-fold CV, AUC from probabilities</text>
<rect x="668" y="128" width="296" height="368" rx="12" class="panel"/><text x="684.0" y="154.0" class="eyebrow">FINDINGS</text><text x="684.0" y="176.0" class="h2">What the leakage test shows</text>
<text x="684.0" y="212.0" class="lab">With the assays</text>
<text x="684.0" y="227.0" class="lab">all 8 features</text>
<rect x="848" y="192" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="216.0" class="tval" text-anchor="middle">0.996</text>
<text x="898.0" y="230.0" class="tsub" text-anchor="middle">ROC AUC</text>
<text x="684.0" y="264.0" class="lab">Without them</text>
<text x="684.0" y="279.0" class="lab">6 features</text>
<rect x="848" y="244" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="268.0" class="tval" text-anchor="middle">0.615</text>
<text x="898.0" y="282.0" class="tsub" text-anchor="middle">baseline 0.604</text>
<text x="684.0" y="316.0" class="lab">The assays</text>
<text x="684.0" y="331.0" class="lab">on their own</text>
<rect x="848" y="296" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="320.0" class="tval" text-anchor="middle">0.994</text>
<text x="898.0" y="334.0" class="tsub" text-anchor="middle">ROC AUC</text>
<text x="684.0" y="368.0" class="lab">One cut-off,</text>
<text x="684.0" y="383.0" class="lab">no model at all</text>
<rect x="848" y="348" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="372.0" class="tval" text-anchor="middle">0.882</text>
<text x="898.0" y="386.0" class="tsub" text-anchor="middle">accuracy</text>
<text x="684.0" y="418.0" class="body">Dropping 2 of 8 inputs collapses the</text>
<text x="684.0" y="434.5" class="body">model to the majority-class baseline.</text>
<text x="684.0" y="451.0" class="body">The assays hold 91.9% of importance.</text>
<path class="chev" d="M339,298 l6,6 l-6,6"/>
<path class="chev" d="M655,298 l6,6 l-6,6"/>
<rect x="36" y="512" width="928" height="110" rx="12" class="panel"/>
<text x="52.0" y="538.0" class="eyebrow">WORKFLOW</text>
<text x="140.0" y="538.0" class="small">Python notebook: pandas, seaborn, scikit-learn, XGBoost and joblib</text>
