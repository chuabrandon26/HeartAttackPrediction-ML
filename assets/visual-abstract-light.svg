<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" width="1000" height="752" role="img" aria-labelledby="t d">
<title id="t">Visual abstract: target leakage in a heart attack dataset</title>
<desc id="d">A heart attack classifier reaches 0.996 ROC AUC on 1,283 cleaned patient records using troponin and CK-MB, the two blood tests a heart attack is diagnosed with. Removing them drops ROC AUC to 0.615 against a 0.604 majority-class baseline, and a single threshold on troponin with no model reaches 0.882 accuracy. The two assays hold 91.9 percent of the model's feature importance, identifying the result as target leakage.</desc>
