<text x="319.9" y="581.0" class="step-tool">leakage test</text>
<text x="319.9" y="594.0" class="small">drop the assays</text>
<rect x="440.3" y="548" width="119.4" height="50" rx="8" class="chip" style="animation-delay:3.6s"/>
<text x="449.3" y="565.0" class="step-n">4</text>
<text x="460.3" y="566.0" class="step-role">Split</text>
<text x="449.3" y="581.0" class="step-tool">scikit-learn</text>
<text x="449.3" y="594.0" class="small">75 / 25</text>
<rect x="569.7" y="548" width="119.4" height="50" rx="8" class="chip" style="animation-delay:4.8s"/>
<text x="578.7" y="565.0" class="step-n">5</text>
<text x="589.7" y="566.0" class="step-role">Benchmark</text>
<text x="578.7" y="581.0" class="step-tool">5 classifiers</text>
<text x="578.7" y="594.0" class="small">DT to XGBoost</text>
<rect x="699.1" y="548" width="119.4" height="50" rx="8" class="chip" style="animation-delay:6.0s"/>
<text x="708.1" y="565.0" class="step-n">6</text>
<text x="719.1" y="566.0" class="step-role">Tune</text>
<text x="708.1" y="581.0" class="step-tool">RandomizedSearch</text>
<text x="708.1" y="594.0" class="small">3-fold CV</text>
<rect x="828.6" y="548" width="119.4" height="50" rx="8" class="chip" style="animation-delay:7.2s"/>
<text x="837.6" y="565.0" class="step-n">7</text>
<text x="848.6" y="566.0" class="step-role">Deploy</text>
<text x="837.6" y="581.0" class="step-tool">joblib</text>
<text x="837.6" y="594.0" class="small">risk scoring</text>
<text x="36.0" y="650.0" class="eyebrow">TAKE-HOME</text>
<text x="36.0" y="673.0" class="take">A tuned Random Forest reaches <tspan class="em">0.996 ROC AUC</tspan>, and removing troponin and CK-MB drops it to</text>
<text x="36.0" y="694.0" class="take"><tspan class="em">0.615</tspan>, at a 0.604 baseline. The assays are how the diagnosis is made, so this is target leakage.</text>
