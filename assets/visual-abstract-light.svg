<text x="72.0" y="566.0" class="step-role">EDA</text>
<text x="61.0" y="581.0" class="step-tool">pandas · seaborn</text>
<text x="61.0" y="594.0" class="small">distributions</text>
<rect x="181.4" y="548" width="119.4" height="50" rx="8" class="chip" style="animation-delay:1.2s"/>
<text x="190.4" y="565.0" class="step-n">2</text>
<text x="201.4" y="566.0" class="step-role">Clean</text>
<text x="190.4" y="581.0" class="step-tool">rule-based</text>
<text x="190.4" y="594.0" class="small">impossible values</text>
<rect x="310.9" y="548" width="119.4" height="50" rx="8" class="chip" style="animation-delay:2.4s"/>
<text x="319.9" y="565.0" class="step-n">3</text>
