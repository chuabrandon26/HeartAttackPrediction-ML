<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" width="1000" height="752" role="img" aria-labelledby="t d">
<title id="t">Visual abstract: Predicting heart attacks from clinical biomarkers</title>
<desc id="d">Five tree-based classifiers (decision tree, random forest, gradient boosting, AdaBoost, XGBoost) predict heart attack from age, sex, heart rate, blood pressure, blood sugar, CK-MB and troponin in 1,283 cleaned patient records. A tuned random forest reaches 99.07 percent test accuracy and 99.49 percent precision on held-out patients.</desc>
