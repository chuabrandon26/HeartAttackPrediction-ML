<path d="M207.0,278.2 A46,46 0 0 1 230.0,318.0" class="m-gauge hom"/>
<line x1="184.0" y1="318" x2="210.2" y2="296.3" class="m-needle"/>
<circle cx="184.0" cy="318" r="4" class="m-center"/>
<text x="132.0" y="320.0" class="m-lab" text-anchor="end">low</text>
<text x="236.0" y="320.0" class="m-lab">high</text>
<text x="184.0" y="342.0" class="small" text-anchor="middle">From biomarkers to a low, medium or high risk call</text>
<text x="52.0" y="368.0" class="body">Troponin and CK-MB rise when heart</text>
<text x="52.0" y="384.5" class="body">muscle is damaged. Combined with age,</text>
<text x="52.0" y="401.0" class="body">blood pressure, heart rate and blood</text>
<text x="52.0" y="417.5" class="body">sugar, they can feed a fast triage</text>
<text x="52.0" y="434.0" class="body">model.</text>
<rect x="48" y="446" width="272" height="38" rx="8" class="qbox"/>
<circle cx="68" cy="465" r="10" class="qmark"/>
<text x="68.0" y="470.0" class="qmark-t" text-anchor="middle">?</text>
<text x="86.0" y="461.0" class="q">How accurately can tree ensembles</text>
<text x="86.0" y="477.0" class="q">classify patients from lab values?</text>
<rect x="352" y="128" width="296" height="368" rx="12" class="panel"/><text x="368.0" y="154.0" class="eyebrow">DATA AND DESIGN</text><text x="368.0" y="176.0" class="h2">1,319 patient records</text>
<rect x="368" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="222.0" class="num">1,283</text>
<text x="380.0" y="239.0" class="small">patients after QC</text>
<rect x="504" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="222.0" class="num">8</text>
<text x="516.0" y="239.0" class="small">clinical features</text>
<rect x="368" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="296.0" class="num">2</text>
<text x="380.0" y="313.0" class="small">engineered flags</text>
<rect x="504" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="296.0" class="num">75/25</text>
<text x="516.0" y="313.0" class="small">train / test split</text>
<text x="368.0" y="362.0" class="body">Physically impossible readings (heart</text>
<text x="368.0" y="378.5" class="body">rate above 200, blood sugar outside 50</text>
<text x="368.0" y="395.0" class="body">to 600 mg/dL, CK-MB above 200) are</text>
<text x="368.0" y="411.5" class="body">removed before modeling.</text>
<line x1="368" y1="446" x2="632" y2="446" class="rule"/>
<text x="368.0" y="466.0" class="small">Flags: CK-MB &gt; 50 and troponin &gt; 0.04 ng/mL</text>
<text x="368.0" y="481.0" class="small">Tuning: RandomizedSearchCV, 3-fold CV</text>
<rect x="668" y="128" width="296" height="368" rx="12" class="panel"/><text x="684.0" y="154.0" class="eyebrow">FINDINGS</text><text x="684.0" y="176.0" class="h2">Held-out test performance</text>
<text x="684.0" y="212.0" class="lab">Random Forest</text>
<text x="684.0" y="227.0" class="lab">(tuned)</text>
<rect x="848" y="192" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="216.0" class="tval" text-anchor="middle">99.07%</text>
<text x="898.0" y="230.0" class="tsub" text-anchor="middle">test accuracy</text>
<text x="684.0" y="264.0" class="lab">Random Forest</text>
<text x="684.0" y="279.0" class="lab">precision</text>
<rect x="848" y="244" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="268.0" class="tval" text-anchor="middle">99.49%</text>
<text x="898.0" y="282.0" class="tsub" text-anchor="middle">recall 98.99%</text>
<text x="684.0" y="316.0" class="lab">XGBoost and</text>
<text x="684.0" y="331.0" class="lab">Gradient Boost</text>
<rect x="848" y="296" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="320.0" class="tval" text-anchor="middle">98.75%</text>
<text x="898.0" y="334.0" class="tsub" text-anchor="middle">test accuracy</text>
<text x="684.0" y="368.0" class="lab">Decision Tree and</text>
<text x="684.0" y="383.0" class="lab">AdaBoost</text>
<rect x="848" y="348" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="372.0" class="tval" text-anchor="middle">98.44%</text>
<text x="898.0" y="386.0" class="tsub" text-anchor="middle">test accuracy</text>
<text x="684.0" y="418.0" class="body">Troponin and CK-MB are themselves</text>
<text x="684.0" y="434.5" class="body">diagnostic markers, which helps</text>
<text x="684.0" y="451.0" class="body">explain the very high scores.</text>
