<text x="36.0" y="650.0" class="eyebrow">TAKE-HOME</text>
<text x="36.0" y="673.0" class="take">A tuned Random Forest reaches <tspan class="em">99.07% test accuracy</tspan> on held-out patients, and the saved model scores new</text>
<text x="36.0" y="694.0" class="take">patients instantly. However, troponin and CK-MB are diagnostic markers, so <tspan class="em">external validation</tspan> is the next step.</text>
